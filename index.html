<!DOCTYPE html>
<html lang="en">
<head>
    	<link rel="icon" type="image/svg+xml"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='-27' y='75' font-family='Courier' font-size='117' fill='%23000'%3E☕%3C/text%3E%3C/svg%3E" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarryMeMaybe?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* Main body styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #c697a7;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            padding: 1rem;
            box-sizing: border-box;
        }

        /* Container for the heart animation and text */
        .heart-container {
            position: relative;
            width: 350px; /* Increased size */
            height: 350px; /* Increased size */
            animation: beat 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
            /* Flexbox to center the text inside */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The heart shape, created with CSS */
        .heart {
            position: absolute;
            width: 175px; /* Increased size & made square */
            height: 175px; /* Increased size & made square */
            top: 87.5px;
            left: 87.5px;
            background-color: #e91e63; /* A deep pink color for the heart */
            transform: rotate(-45deg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Using pseudo-elements to create the two lobes of the heart */
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 175px; /* Increased size */
            height: 175px; /* Increased size */
            background-color: #e91e63;
            border-radius: 50%;
        }

        .heart::before {
            top: -87.5px; /* Adjusted position */
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 87.5px; /* Adjusted position */
        }

        /* The keyframes animation for the beating effect */
        @keyframes beat {
            0% {
                transform: scale(0.95);
            }
            5% {
                transform: scale(1.1);
            }
            39% {
                transform: scale(0.85);
            }
            45% {
                transform: scale(1);
            }
            60% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(0.90);
            }
        }

        /* Styling for the text message now inside the heart */
        .message {
            font-family: 'Pacifico', cursive;
            font-size: 2rem; /* Adjusted size to fit inside larger heart */
            color: #ffffff; /* White text for contrast */
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            padding: 0 1rem;
            z-index: 10; /* Ensure text is above the heart shape */
            position: relative; /* Position relative to the container */
            max-width: 80%; /* Prevent text from overflowing */
        }

        /* --- Mobile Responsive adjustments --- */
        /* For tablets and smaller devices */
        @media (max-width: 768px) {
             .heart-container {
                width: 300px;
                height: 300px;
            }
            .heart {
                width: 150px;
                height: 150px;
                top: 75px;
                left: 75px;
            }
            .heart::before,
            .heart::after {
                width: 150px;
                height: 150px;
            }
            .heart::before { top: -75px; }
            .heart::after { left: 75px; }
            .message {
                font-size: 1.7rem;
            }
        }

        /* For mobile phones */
        @media (max-width: 480px) {
            .heart-container {
                width: 250px; /* Scaled down for mobile */
                height: 250px;
            }

            .heart {
                width: 125px;
                height: 125px;
                top: 62.5px;
                left: 62.5px;
            }

            .heart::before,
            .heart::after {
                width: 125px;
                height: 125px;
            }

            .heart::before {
                top: -62.5px;
                left: 0;
            }

            .heart::after {
                top: 0;
                left: 62.5px;
            }

            .message {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Heart Animation and Text Container -->
    <div class="heart-container">
        <!-- The visual heart shape -->
        <div class="heart"></div>
        <!-- The text message -->
        <p class="message">ur one warm glass of milk bby</p>
    </div>

</body>
</html>
